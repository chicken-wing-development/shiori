[package]
name = "shiori-markdown"
version = "1.0.0"
description = "A single-document Markdown editor with self-contained HTML and PDF export"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "shiori_markdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.23"
percent-encoding = "2"
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_System_Com"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
