<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ローカル画像の表示確認 — shiori</title>
    <style>
      body { font: 15px/1.8 'Segoe UI', 'Yu Gothic UI', sans-serif; background: #faf9f6; color: #303832; margin: 0; padding: 28px; }
      main { max-width: 680px; margin: auto; }
      h1 { font-size: 23px; font-weight: 500; }
      #rendered { background: #fffefa; padding: 20px; border: 1px solid #d9e3d5; border-radius: 9px; }
      #rendered img { display: block; max-width: 192px; height: auto; }
      #results { padding-left: 22px; font-size: 13px; }
      .pass { color: #275d50; }
      .fail { color: #a33125; }
      #summary { font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>ローカル画像の表示確認</h1>
      <p>フォルダー内の画像を、アプリと同じ読込・描画処理で表示します。</p>
      <div id="rendered"></div>
      <ol id="results"></ol>
      <p id="summary" role="status">確認中…</p>
    </main>
    <script type="module" src="./images.browser.ts"></script>
  </body>
</html>
